[project]
name = "getnet-multi-agent-support-v2"
version = "0.1.0"
description = "Python service generated from the Claude Code engineering harness"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "fastapi>=0.141.1",
    "google-genai>=2.19.0",
    "gradio>=6.25.0",
    "httpx>=0.28.1",
    "pydantic>=2.11",
    "pydantic-settings>=2.8",
    "structlog>=25.1",
    "tavily-python>=0.7.27",
    "uvicorn>=0.52.4",
]

[project.optional-dependencies]
# Opt-in LLM tracing; see docs/LLM_OBSERVABILITY.md. Install with `uv sync --extra tracing`.
tracing = [
    "langfuse>=3.0",
]

[dependency-groups]
dev = [
    "bandit[toml]>=1.8",
    "mypy>=1.16",
    "pip-audit>=2.9",
    "pytest>=8.4",
    "pytest-cov>=6.2",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/getnet_support"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
    "RUF",
    "ANN",
    "D",
    "S",
]
ignore = [
    "ANN401", # Any is handled as an architecture concern and reviewed explicitly.
    "D203",   # Incompatible with D211.
    "D213",   # Google style uses D212.
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "S101", "ANN"]
"scripts/**/*.py" = ["D"]
# scripts/_vendor_loop_schemas/models.py quotes its `from_dict` classmethods'
# self-referencing return annotations on purpose (see that file's own header
# comment): the quotes are load-bearing on Python 3.12/3.13 and only look
# removable to ruff's UP037 when this project's own target-version is 3.14.
# Suppressed here (not with an inline noqa) because an inline noqa becomes an
# unused-directive RUF100 error on 3.12/3.13, where UP037 never fires.
"scripts/_vendor_loop_schemas/models.py" = ["UP037"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_unused_ignores = true
show_error_codes = true
pretty = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
# langfuse is the optional "tracing" extra; not installed by default, so no
# stubs are available unless a project opts in with `uv sync --extra tracing`.
module = ["langfuse"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# tavily-python ships no py.typed marker / stubs as of the pinned version.
module = ["tavily", "tavily.errors"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# gradio synthesizes component event methods (.click()/.submit()/...) from
# each component's EVENTS list via a metaclass at runtime. Whether mypy
# resolves them statically is environment-dependent with identical locked
# dependency versions (reproduced: fails on the Linux CI runner, passes
# locally on macOS) - disable unused-ignore here so this file type-checks
# cleanly either way instead of flip-flopping between environments.
module = ["getnet_support.entrypoints.ui"]
warn_unused_ignores = false

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=src/getnet_support --cov-report=term-missing -m 'not live'"
testpaths = ["tests"]
markers = [
    "live: smoke com API keys reais (nao roda no quality gate)",
    "integration: tests that require real infrastructure",
    "contract: tests that verify an interface contract",
    "e2e: critical end-to-end tests",
]

[tool.coverage.run]
branch = true
source = ["src/getnet_support"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.bandit]
exclude_dirs = ["tests"]
skips = []

[tool.engineering-harness.quality]
source-roots = ["src"]
test-roots = ["tests"]

[tool.engineering-harness.architecture]
source-roots = ["src"]
clean-architecture = true
